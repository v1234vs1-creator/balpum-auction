<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>현장 리포트 작성 | 발품옥션 파트너</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<style>
:root{--ink:#0e1116;--ink2:#333d4b;--muted:#6b7684;--faint:#b0b8c1;--gray:#f4f5f7;--gray2:#eaecef;--line:#e5e8eb;--lime:#c8f03c;--navy:#0b1220;
  --ok:#12a46b;--ok-bg:#e6f6ee;--warn:#e8590c;--warn-bg:#fdf0e7;--red:#f04452;--head:"Wanted Sans Variable",Pretendard,sans-serif;--ease-out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--gray);color:var(--ink);font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;font-size:15.5px;line-height:1.6;letter-spacing:-.012em;word-break:keep-all;-webkit-font-smoothing:antialiased;padding-bottom:110px}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top div{max-width:760px;margin:0 auto;padding:0 16px;height:58px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top b{font-family:var(--head);font-weight:700;letter-spacing:-.04em;font-size:16.5px}
.top small{color:var(--muted);font-size:13px}
.wrap{max-width:760px;margin:0 auto;padding:18px 12px}
h1{font-family:var(--head);font-weight:620;font-size:24px;letter-spacing:-.04em;margin:8px 4px 4px}
.lead{color:var(--muted);margin:0 4px 18px;font-size:14.5px}
.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:50px;padding:0 18px;border-radius:14px;border:0;font-family:var(--head);font-weight:620;font-size:15.5px;cursor:pointer;transition:transform 160ms var(--ease-out),background-color 150ms ease}
.btn:active{transform:scale(.97)}
.btn-ink{background:var(--ink);color:#fff}.btn-lime{background:var(--lime);color:var(--ink)}.btn-gray{background:var(--gray);color:var(--ink)}
.btn.sm{height:38px;padding:0 12px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.4}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:11px 13px;outline:0;transition:border-color 150ms ease}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
textarea{resize:vertical;min-height:64px}
label.l{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.err{color:var(--red);font-size:14px;margin:8px 0 0}
.items .it{display:block;width:100%;text-align:left;background:#fff;border:0;border-radius:18px;padding:16px 18px;margin-bottom:8px;cursor:pointer;transition:transform 160ms var(--ease-out)}
.items .it:active{transform:scale(.985)}
.it b{display:block;font-family:var(--head);font-weight:620;font-size:16.5px;letter-spacing:-.03em}
.it small{color:var(--muted);font-size:13px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:7px;padding:2px 7px;margin-left:4px;vertical-align:1px}
.badge.lime{background:var(--lime)}.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.gray{background:var(--gray);color:var(--muted)}
details.sec{background:#fff;border-radius:20px;margin-bottom:10px;overflow:hidden}
details.sec summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 20px;cursor:pointer;font-family:var(--head);font-weight:620;font-size:17px;letter-spacing:-.03em}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary span{font-family:"Pretendard Variable",sans-serif;font-weight:500;font-size:13px;color:var(--muted)}
details.sec summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);transition:transform 200ms var(--ease-out);margin-left:auto}
details.sec[open] summary::after{transform:rotate(-135deg)}
.sec .in{padding:0 20px 20px}
.row{border-top:1px solid var(--line);padding:14px 0}
.row:first-child{border-top:0;padding-top:0}
.row .h{display:flex;gap:8px;align-items:center}
.row .h input{font-weight:600;padding:8px 10px}
.row textarea{margin-top:8px}
.row .f{display:flex;gap:8px;align-items:center;margin-top:8px}
.seg{display:flex;background:var(--gray);border-radius:11px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:none;border-radius:8px;height:32px;padding:0 10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:background-color 150ms ease,color 150ms ease}
.seg button.on.ok{background:var(--ok);color:#fff}.seg button.on.warn{background:var(--warn);color:#fff}.seg button.on.na{background:var(--ink2);color:#fff}
.row .f input{width:110px;flex:none;padding:7px 10px;font-size:14px}
.x{flex:none;width:34px;height:34px;border-radius:10px;border:0;background:var(--gray);color:var(--muted);cursor:pointer;font-size:18px;line-height:1}
.add{width:100%;margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
@media (max-width:520px){.photos{grid-template-columns:repeat(2,1fr)}}
.ph{position:relative}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--gray)}
.ph .no{position:absolute;top:6px;left:6px;background:var(--ink);color:#fff;font-size:11.5px;font-weight:700;border-radius:7px;padding:2px 7px}
.ph .x{position:absolute;top:6px;right:6px;width:28px;height:28px;background:rgba(255,255,255,.92)}
.ph input{margin-top:6px;padding:7px 9px;font-size:13.5px}
.ph.up img{opacity:.4}
.ph .star{position:absolute;bottom:44px;right:6px;width:30px;height:30px;border-radius:9px;border:0;background:rgba(255,255,255,.92);color:var(--faint);font-size:16px;cursor:pointer}
.ph .star.on{background:var(--lime);color:var(--ink)}
.ph.up::after{content:"올리는 중…";position:absolute;top:34%;left:0;right:0;text-align:center;font-size:13px;font-weight:600}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px dashed var(--gray2);border-radius:16px;padding:22px;cursor:pointer;color:var(--muted);text-align:center;transition:border-color 150ms ease,background-color 150ms ease}
.drop:active{background:var(--gray)}
.drop b{color:var(--ink);font-family:var(--head);font-weight:620}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bottom div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.bottom .btn{width:100%}
.saved{font-size:12.5px;color:var(--muted);text-align:center;margin:-2px 0 6px}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;border-radius:14px;padding:12px 18px;font-size:14.5px;z-index:20;transition:opacity 250ms ease,transform 400ms var(--ease-out);pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.done{background:var(--navy);color:#fff;border-radius:20px;padding:24px}
.done b{font-family:var(--head);font-size:20px}
.done input{margin-top:12px;background:#18233a;border-color:transparent;color:#fff}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
</style>
</head>
<body>
<div class="top"><div><b>발품옥션 파트너</b><small id="who"></small></div></div>
<div class="wrap" id="app"></div>
<div class="bottom" id="bottom" hidden><p class="saved" id="saved"></p><div>
  <button class="btn btn-gray" id="b-preview">미리보기</button>
  <button class="btn btn-gray" id="b-save">임시 저장</button>
  <button class="btn btn-lime" id="b-publish">리포트 발행</button></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" multiple hidden>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzHqw1TadGxsVEYpnsnaBl2ZzXr0Ohn5uJ7bSRHe6LDLrDCNOPXfknYazCJImYj7QnvXQ/exec';
const SITE = location.href.replace(/field\.html.*$/, '');
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
let KEY = localStorage.getItem('balpum_partner_key') || '';
let ITEMS = [], ITEM = null, R = null;

function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2400); }
async function post(data) { const j = await (await fetch(ENDPOINT, { method: 'POST', body: JSON.stringify({ ...data, key: KEY }) })).json(); if (!j.ok) throw new Error(j.error || 'fail'); return j; }

// 1. 비밀번호
function login(msg) {
  $('bottom').hidden = true;
  $('app').innerHTML = `<h1>현장 리포트 작성</h1><p class="lead">임장을 다녀온 뒤 사진과 확인 내용을 올리면 손님에게 보낼 리포트가 만들어집니다.</p>
  <div class="card"><label class="l" for="k">파트너 비밀번호</label><input id="k" type="password" autocomplete="current-password" value="${esc(KEY)}">
  <p class="err">${msg || ''}</p><button class="btn btn-ink" id="go" style="width:100%;margin-top:12px">들어가기</button>
  <p class="hint">비밀번호는 운영팀에서 받으세요. 이 기기에만 저장됩니다.</p></div>
  <p class="hint" style="text-align:center">아직 파트너가 아니라면 <a href="partner.html">파트너 지원</a></p>`;
  $('go').onclick = async () => { KEY = $('k').value.trim(); $('go').disabled = true; $('go').textContent = '확인 중…'; await loadItems(); };
}

async function loadItems() {
  try {
    const j = await (await fetch(`${ENDPOINT}?action=partnerItems&key=${encodeURIComponent(KEY)}`)).json();
    if (!j.ok) { localStorage.removeItem('balpum_partner_key'); return login(j.error === 'key' ? '비밀번호가 맞지 않습니다.' : '불러오지 못했습니다.'); }
    localStorage.setItem('balpum_partner_key', KEY);
    ITEMS = j.items; pick();
  } catch (_) { login('연결하지 못했습니다. 잠시 뒤 다시 시도해 주세요.'); }
}

// 2. 물건 고르기
function pick() {
  $('bottom').hidden = true; $('who').textContent = '';
  $('app').innerHTML = `<h1>어떤 물건을 다녀오셨나요?</h1><p class="lead">출발이 확정된 물건부터 보입니다.</p>
  <div class="items">${ITEMS.length ? ITEMS.sort((a, b) => (a.status === '확정' ? -1 : 0) - (b.status === '확정' ? -1 : 0) || String(a.date).localeCompare(b.date)).map((it, i) => `
    <button class="it" data-i="${ITEMS.indexOf(it)}"><b>${esc(it.addr)} ${esc(it.name)}</b>
    <small>${esc(it.court)} ${esc(it.caseNo)} · 매각기일 ${esc(it.date)}</small><br>
    <span class="badge ${it.status === '확정' ? 'lime' : 'gray'}">${esc(it.status || '모집')}</span>
    ${it.memos.length ? `<span class="badge gray">요청 ${it.memos.length}건</span>` : ''}
    ${it.draft ? `<span class="badge ok">${it.draft.status === '공개' ? '발행됨' : '초안 있음'}</span>` : ''}</button>`).join('') : '<div class="card">등록된 물건이 없습니다.</div>'}</div>`;
  document.querySelectorAll('.it').forEach(b => b.onclick = () => open(ITEMS[+b.dataset.i]));
}

// 발품 체크리스트 v2 — 손님이 혼자 가서는 얻기 어려운 것 위주. [항목, 무엇을 어떻게 보는지]
// 순서: 명도 단서 → 돈(관리비·추가 부담) → 하자 → 단지 공지 → 세대·생활 → 주변 → 주차
const DEF = () => [
  { title: '점유와 명도 단서', lead: '집 안에 들어가지 않고 밖에서 모은 단서입니다. 낙찰 뒤 명도가 얼마나 수월할지 가늠하는 근거가 됩니다.', rows: [
    ['우편함', '우편물 개수·소인 날짜, 오래 쌓였는지. 법원·채권추심·카드사 우편이 많은지 (이름은 적지 않기)'],
    ['전기 계량기', '도착할 때와 떠날 때 두 번 숫자, 원판 회전. 숫자가 늘면 지금 사는 중'],
    ['가스 검침표·수도', '현관 옆 검침 스티커 날짜, 수도 계량기 숫자 (잠겨 있으면 미확인)'],
    ['현관 앞', '택배(받는 사람 성이 여러 개인지), 신발·유모차, 고지서·법원 안내문 부착'],
    ['창·베란다', '밖에서 보이는 커튼, 조명, 빨래, 짐. 저녁에 불이 켜지는지'],
    ['초인종', '두 번 누르고 시각을 적기. 응답 여부만 (대화·신원 확인 하지 않기)'],
    ['관리사무소가 아는 것', '등록 차량 수, 실거주인지 세입자인지 아는 범위, 최근 출입·연락 여부'],
    ['명도 난이도 판단', '위 단서로 쉬움 / 보통 / 어려움과 그 이유 한 줄'] ] },
  { title: '관리비와 낙찰 후 추가 부담', lead: '관리사무소에 경매 입찰 검토 목적을 밝히고 항목별로 확인했습니다. 낙찰자가 떠안는 것은 보통 공용부분 관리비(최근 3년분, 연체료 제외)입니다.', rows: [
    ['체납 기간·합계', '몇 개월째, 연체료 포함 총액'],
    ['공용부분 (연체료 제외)', '일반관리비·청소·승강기·경비·수선유지비 등 공용 항목만, 연체료 빼고'],
    ['전용부분·연체료', '세대 전기·수도·난방 사용료와 연체료 (낙찰자가 보통 떠안지 않는 부분)'],
    ['장기수선충당금 미납', '미납 여부와 금액'],
    ['예정된 공사·분담금', '엘리베이터 교체, 외벽 도색, 배관 교체 등 앞으로 걷을 돈'],
    ['월평균 관리비', '같은 평형 여름·겨울 금액, 난방 방식 (낙찰 후 보유 비용)'],
    ['누수·하자 민원', '이 세대와 위·아래층의 민원 기록'] ] },
  { title: '건물 하자', rows: [
    ['외벽', '도색 시기, 균열·백화(흰 얼룩)·물자국 (사진 필수)'],
    ['세대 창 외부', '창틀 변색·곰팡이 자국 (결로 흔적), 외부 실외기 상태'],
    ['복도·계단실', '해당 층과 위층 천장·벽의 얼룩, 곰팡이'],
    ['승강기', '대수, 교체 연도, 소음·멈춤 공지'],
    ['배관·옥상', '배관 교체 연도 (장기수선계획), 최상층·1층이면 옥상·필로티 누수'],
    ['창호(외부 관찰)', '이중창 교체 여부, 방마다 다른지'],
    ['불법 확장·증축', '밖에서 보이는 구조 변경, 베란다 확장 흔적'] ] },
  { title: '단지 게시판·관리 공지', lead: '개인이 잘 보지 않는 단지 게시판과 엘리베이터 공지를 확인했습니다.', rows: [
    ['재건축·리모델링', '추진위·설명회·동의서 공지 여부'],
    ['소송·분쟁', '하자 소송, 관리업체 분쟁, 주민 갈등 공지'],
    ['관리비 인상·공사', '관리비 인상, 단수·정전 공사, 도색 공고'],
    ['단지 분위기', '분리수거장·조경·놀이터 관리 상태, 주민 공지 어조'] ] },
  { title: '세대 위치와 생활', rows: [
    ['향·일조', '확인 시각과 해가 드는 방향, 앞 동 높이·거리 (겨울에 가려질지)'],
    ['층·조망', '전체 층수, 앞 동과의 거리, 가림 여부'],
    ['구조', '계단식·복도식, 방·욕실 수 (관리사무소 평면도)'],
    ['동 위치', '정문·지하철 쪽 출입구까지 거리, 언덕 여부'],
    ['가까운 불편 시설', '쓰레기장·환기구·변압기·흡연 구역·놀이터가 붙어 있는지'],
    ['같은 평형 내부', '중개사무소에서 같은 타입 매물 내부를 볼 수 있으면 상태와 수리 범위'] ] },
  { title: '주변 환경', lead: '모두 직접 걸어서 잰 시간입니다.', rows: [
    ['지하철역', '정문에서 개찰구까지 직접 걸은 시간과 거리'],
    ['초등학교', '배정 학교(학구도), 도보 시간, 건너는 횡단보도 수'],
    ['학원가·생활 시설', '학원가, 대형마트, 병원까지 시간'],

// 3. 작성
function open(it) {
  ITEM = it;
  const local = localStorage.getItem('balpum_field_' + it.caseNo);
  let server = null; try { server = it.draft && it.draft.data ? JSON.parse(it.draft.data) : null; } catch (_) {}
  R = local ? JSON.parse(local) : server || blank(it);
  // 새로 들어온 요청사항은 덧붙인다
  it.memos.forEach(q => { if (!R.qa.some(x => x.q === q)) R.qa.push({ who: '신청자 ' + 'ABCDEFGHIJ'[R.qa.length], q, a: '' }); });
  R.route = R.route || []; R.numbers = R.numbers || {};
  $('who').textContent = it.caseNo;
  draw();
  $('bottom').hidden = false;
}

// 값 넣기: data-p="sections.0.rows.1.v"
function setPath(path, val) { const ks = path.split('.'); let o = R; ks.slice(0, -1).forEach(k => o = o[k]); o[ks[ks.length - 1]] = val; }
function getParent(path) { const ks = path.split('.'); let o = R; ks.slice(0, -1).forEach(k => o = o[k]); return [o, +ks[ks.length - 1]]; }
$('app').addEventListener('input', e => { const p = e.target.dataset.p; if (p) { setPath(p, e.target.value); save(); } });
$('app').addEventListener('change', e => { const c = e.target.dataset.chk; if (c) { setPath(c, e.target.checked); save(); } });
$('app').addEventListener('click', e => {
  const t = e.target;
  const seg = t.closest('[data-st]');
  if (seg && t.dataset.v) { setPath(seg.dataset.st + '.st', t.dataset.v); seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === t)); save(); return; }
  if (t.dataset.del) { const [arr, i] = getParent(t.dataset.del); arr.splice(i, 1); save(); draw(); return; }
  if (t.dataset.dellist) { const [arr, i] = getParent(t.dataset.dellist); arr.splice(i, 1); save(); draw(); return; }
  if (t.dataset.delp) { const wasCover = R.photos[+t.dataset.delp].cover; R.photos.splice(+t.dataset.delp, 1); if (wasCover && R.photos[0]) R.photos[0].cover = true; save(); updatePhotos(); return; }
  if (t.dataset.ev) { R.evict = t.dataset.ev; t.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === t)); save(); return; }
  if (t.dataset.cover) { R.photos.forEach((p, i) => { p.cover = i === +t.dataset.cover; }); save(); updatePhotos(); return; }
  if (t.dataset.addrow) { R.sections[+t.dataset.addrow].rows.push({ k: '', v: '', ref: '', st: 'ok' }); save(); draw(); return; }
  if (t.dataset.addlist) {
    const blankOf = { brokers: { name: '', sale: '', jeonse: '', quote: '' }, deals: { when: '', price: '', floor: '' }, videos: { cap: '', url: '' }, missing: { k: '', why: '', how: '' }, summary: { st: 'ok', t: '', d: '' } };
    R[t.dataset.addlist].push({ ...blankOf[t.dataset.addlist] }); save(); draw();
  }
});

function autoSummary() {
  const out = [];
  if (R.evict) out.push({ st: R.evict === '쉬움' ? 'ok' : 'warn', t: `명도 난이도 ${R.evict}`, d: R.evictWhy || '' });
  R.sections.forEach(s => {
    s.rows.filter(r => r.st === 'warn' && r.v).forEach(r => out.push({ st: 'warn', t: `${r.k}: ${r.v.split(/[.。]/)[0]}`, d: r.v }));
    if (s.note) out.push({ st: s.warn ? 'warn' : 'ok', t: s.title, d: s.note });
  });
  const b = R.brokers.filter(x => x.sale);
  if (b.length) out.push({ st: 'ok', t: `인근 중개사무소 호가 ${b.map(x => x.sale).join(' / ')}`, d: `${b.length}곳 방문` });
  if (!out.length) return toast('먼저 항목을 채우고 눌러 주세요');
  R.summary = out.slice(0, 6); save(); draw(); toast('요약을 채웠습니다. 문장을 다듬어 주세요');
}

// 자동 저장 (이 기기): 글자를 칠 때마다 저장하면 휴대폰이 버벅여서, 손을 멈추고 0.6초 뒤에 한 번만 저장한다
const photoData = p => ({ url: p.url, cap: p.cap, time: p.time, ...(p.cover ? { cover: true } : {}) });
let saveTimer = null;
function save() {
  if (!R) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 600);
}
function saveNow() {
  clearTimeout(saveTimer);
  if (!R) return;
  try { localStorage.setItem('balpum_field_' + R.caseNo, JSON.stringify({ ...R, photos: R.photos.filter(p => p.url).map(photoData) })); } catch (_) {}
  $('saved').textContent = '이 기기에 자동 저장됨 · ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
}
addEventListener('pagehide', saveNow);
const payload = () => ({ ...R, route: undefined, photos: R.photos.filter(p => p.url).map(photoData).sort((a, b) => !!b.cover - !!a.cover), deals: R.deals.filter(d => d.price).map(d => ({ ...d, price: +String(d.price).replace(/\D/g, '') })), brokers: R.brokers.filter(b => b.sale || b.quote), qa: R.qa.filter(q => q.a), written: todayStr() });

// 사진 칸만 다시 그린다 (전체를 다시 그리면 쓰던 칸이 닫히고 느려진다)
function photosHtml() {
  return R.photos.map((p, i) => `<div class="ph ${p.up ? 'up' : ''}"><img src="${esc(p.preview || p.url)}" alt="" loading="lazy" decoding="async"><span class="no">${pad(i + 1)}</span>
    <button class="x" data-delp="${i}" aria-label="삭제">×</button>
    <button class="star ${p.cover ? 'on' : ''}" data-cover="${i}" aria-label="대표 사진">★</button>
    <input value="${esc(p.cap)}" data-p="photos.${i}.cap" placeholder="설명 (예: 1층 우편함)"></div>`).join('');
}
function updatePhotos() {
  const box = $('photos'); if (!box) return;
  // 쓰고 있던 설명 칸의 위치는 지킨다
  const focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.p : null;
  box.innerHTML = photosHtml();
  $('ph-count').textContent = `${R.photos.length}장 / 최소 20장`;
  if (focused) { const el = box.querySelector(`[data-p="${focused}"]`); if (el) el.focus(); }
}

// 사진: 긴 변 1600px로 줄여서 두 장씩 동시에 올린다
$('file').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  const items = files.map(f => ({ cap: '', time: new Date(f.lastModified).toTimeString().slice(0, 5), preview: URL.createObjectURL(f), up: true, f }));
  if (!R.photos.length && items[0]) items[0].cover = true;
  R.photos.push(...items); updatePhotos();
  const queue = [...items];
  const worker = async () => {
    for (let p; (p = queue.shift());) {
      try {
        const data = await shrink(p.f);
        const j = await post({ action: 'uploadPhoto', caseNo: R.caseNo, name: p.f.name, mime: 'image/jpeg', data });
        p.url = j.url;
      } catch (err) { toast('사진 한 장을 올리지 못했습니다'); R.photos.splice(R.photos.indexOf(p), 1); }
      delete p.up; delete p.f; save(); updatePhotos();
    }
  };
  await Promise.all([worker(), worker()]);
});
async function shrink(file) {
  // 원본을 다 풀지 않고 처음부터 작게 풀어서 메모리와 시간을 아낀다
  let bmp;
  try { bmp = await createImageBitmap(file, { resizeWidth: 1200, resizeQuality: 'medium' }); }
  catch (_) { bmp = await createImageBitmap(file); }
  const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close && bmp.close();
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .82));
  return await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
}

// 확인 창 대신 '한 번 더 누르면 실행' (브라우저가 확인 창을 막아도 동작)
function armed(btn, label) {
  if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = btn.dataset.old; return true; }
  btn.dataset.armed = 1; btn.dataset.old = btn.textContent; btn.textContent = label;
  setTimeout(() => { if (btn.dataset.armed) { delete btn.dataset.armed; btn.textContent = btn.dataset.old; } }, 4000);
  return false;
}
$('b-preview').onclick = () => { localStorage.setItem('balpum_preview', JSON.stringify(payload())); window.open('report.html?preview=1', '_blank'); };
$('b-save').onclick = async () => {
  const b = $('b-save'); b.disabled = true; b.textContent = '저장 중…';
  try { await post({ action: 'saveReport', caseNo: R.caseNo, report: payload() }); toast('서버에 임시 저장했습니다'); }
  catch (e) { toast(e.message === 'size' ? '내용이 너무 깁니다' : '저장하지 못했습니다'); }
  b.disabled = false; b.textContent = '임시 저장';
};
$('b-publish').onclick = async () => {
  if (R.photos.some(p => p.up)) return toast('사진을 올리는 중입니다. 잠시만요');
  if (!R.summary.length) return toast('요약을 먼저 채워 주세요');
  const b = $('b-publish');
  if (!armed(b, '한 번 더 누르면 발행')) return toast('발행하면 운영팀에 알림이 가고 물건이 "리포트 열람"으로 바뀝니다');
  b.disabled = true; b.textContent = '발행 중…';
  try {
    const j = await post({ action: 'saveReport', caseNo: R.caseNo, report: payload(), publish: true });
    const link = SITE + 'report.html?id=' + j.token;
    $('bottom').hidden = true;
    $('app').innerHTML = `<div class="done"><b>리포트를 발행했습니다</b><p style="opacity:.7;margin:6px 0 0">운영팀에 알림이 갔습니다. 결제한 신청자에게 아래 링크가 전달됩니다.</p>
      <input value="${esc(link)}" readonly onclick="this.select()"><div style="display:flex;gap:8px;margin-top:12px">
      <a class="btn btn-lime" href="${esc(link)}" target="_blank">리포트 보기</a><button class="btn btn-gray" id="again">다른 물건 작성</button></div></div>`;
    $('again').onclick = () => loadItems();
  } catch (e) { toast('발행하지 못했습니다'); b.disabled = false; b.textContent = '리포트 발행'; }
};

if (KEY) loadItems(); else login();
</script>
