<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장 확인 리포트 | 발품옥션</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<style>
:root{--ink:#0e1116;--ink2:#333d4b;--muted:#6b7684;--faint:#b0b8c1;--gray:#f4f5f7;--gray2:#eaecef;--line:#e5e8eb;--lime:#c8f03c;--navy:#0b1220;
  --ok:#12a46b;--ok-bg:#e6f6ee;--warn:#e8590c;--warn-bg:#fdf0e7;--na-bg:#f2f4f6;--head:"Wanted Sans Variable",Pretendard,sans-serif;--ease-out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--gray);color:var(--ink);font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;font-size:15.5px;line-height:1.7;letter-spacing:-.012em;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{display:block;max-width:100%}
.num{font-variant-numeric:tabular-nums}
.notice{background:var(--navy);color:#fff;font-size:13.5px;text-align:center;padding:9px 16px}
.notice b{color:var(--lime)}
.bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar div{max-width:1180px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar b{font-family:var(--head);font-size:17px;font-weight:700;letter-spacing:-.04em}
.bar a.btn{font-family:var(--head);font-size:14px;font-weight:620;text-decoration:none;background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;white-space:nowrap;transition:transform 160ms var(--ease-out)}
.bar a.btn:active{transform:scale(.97)}
.layout{max-width:1180px;margin:0 auto;padding:28px 20px 100px;display:grid;grid-template-columns:210px 1fr;gap:36px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr;gap:0;padding:12px 8px 80px}.toc{display:none}}
.layout>*{min-width:0}
.toc{position:sticky;top:88px;font-size:14px}
.toc a{display:block;padding:7px 12px;border-radius:10px;color:var(--muted);text-decoration:none;transition:background-color 150ms ease,color 150ms ease}
.toc a:hover{background:#fff;color:var(--ink)}
.toc .t{font-size:12px;font-weight:600;color:var(--faint);margin:0 12px 8px}
.paper{background:#fff;border-radius:24px;padding:52px 52px 60px}
@media (max-width:700px){.paper{padding:26px 18px 40px;border-radius:20px}}
.doc-no{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:12px;flex-wrap:wrap}
h1{font-family:var(--head);font-weight:620;font-size:clamp(26px,3.4vw,38px);letter-spacing:-.045em;line-height:1.3;margin:18px 0 6px}
.sub{color:var(--muted);margin:0}
h2{font-family:var(--head);font-weight:620;font-size:23px;letter-spacing:-.035em;margin:64px 0 6px;display:flex;gap:12px;align-items:baseline}
h2 span{font-size:13px;font-weight:600;color:var(--ok);font-family:var(--head)}
h3{font-family:var(--head);font-weight:620;font-size:16px;margin:28px 0 10px}
.lead{color:var(--muted);margin:0 0 16px}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:26px 0 0}
.meta div{background:var(--gray);border-radius:14px;padding:14px 16px;font-size:12.5px;color:var(--muted)}
.meta b{display:block;color:var(--ink);font-size:15.5px;font-weight:600;margin-top:2px}
@media (max-width:700px){.meta{grid-template-columns:1fr 1fr}}
.hero{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:22px}
.hero img{width:100%;height:100%;object-fit:cover;border-radius:16px;background:var(--gray)}
.hero .side{display:grid;gap:8px}
.hero .main{aspect-ratio:16/10}
.hero.one{grid-template-columns:1fr}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.score div{border-radius:16px;padding:18px;font-size:14px}
.score b{display:block;font-family:var(--head);font-size:32px;font-weight:660;letter-spacing:-.04em;line-height:1.2}
.score .ok{background:var(--ok-bg);color:var(--ok)}.score .warn{background:var(--warn-bg);color:var(--warn)}.score .na{background:var(--na-bg);color:var(--muted)}
.nums{background:var(--navy);color:#fff;border-radius:22px;padding:24px;margin:20px 0 26px}
@media (max-width:700px){.nums{padding:18px}}
.nums-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.nums-head b{font-family:var(--head);font-weight:620;font-size:18px}
.nums-head span{font-size:12.5px;color:rgba(255,255,255,.55)}
.nums-top{display:grid;grid-template-columns:1fr 1.3fr;gap:8px;margin-bottom:8px}
@media (max-width:700px){.nums-top{grid-template-columns:1fr}}
.nums-top>div{border-radius:16px;padding:16px 18px}
.nums-top span{display:block;font-size:12.5px;opacity:.75}
.nums-top b{display:block;font-family:var(--head);font-weight:660;font-size:26px;letter-spacing:-.04em;line-height:1.3}
.nums-top small{display:block;font-size:13px;opacity:.85;margin-top:4px;line-height:1.5}
.nums-top .ex{background:var(--lime);color:var(--ink)}
.nums-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:700px){.nums-grid{grid-template-columns:1fr 1fr}}
.nc{background:rgba(255,255,255,.07);border-radius:14px;padding:14px 16px}
.nc span{display:block;font-size:12px;color:rgba(255,255,255,.55)}
.nc b{display:block;font-family:var(--head);font-weight:620;font-size:17px;margin-top:2px;letter-spacing:-.02em}
.nc small{display:block;font-size:12px;color:rgba(255,255,255,.5);margin-top:2px}
.keys{list-style:none;padding:0;margin:0;counter-reset:k}
.keys li{counter-increment:k;display:grid;grid-template-columns:30px 1fr auto;gap:10px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.keys li::before{content:counter(k,decimal-leading-zero);font-family:var(--head);font-size:13px;font-weight:620;color:var(--faint);padding-top:2px}
.keys b{display:block}
.keys small{color:var(--muted);font-size:14px}
.st{display:inline-block;font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.warn{background:var(--warn-bg);color:var(--warn)}.st.na{background:var(--na-bg);color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:540px}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:10px 12px 10px 0;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:13px 12px 13px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{font-weight:600;white-space:nowrap}
td small{display:block;color:var(--muted);font-size:13px}
.ref{font-size:12px;color:var(--faint);white-space:nowrap}
.note{background:var(--gray);border-radius:14px;padding:15px 18px;margin:16px 0;font-size:14.5px}
.note.warn{background:var(--warn-bg);color:#8a3a07}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
figure{margin:0}
figure img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:var(--gray);cursor:zoom-in}
figcaption{font-size:13px;color:var(--muted);margin-top:6px}
figcaption b{color:var(--ink);font-weight:600;margin-right:6px}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 10px;margin-top:14px}
@media (max-width:900px){.gallery{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.gallery{grid-template-columns:repeat(2,1fr)}}
.gallery figcaption{font-size:12.5px;line-height:1.5}
.gallery figcaption b{display:block}
.bars div{display:grid;grid-template-columns:96px 1fr 150px;gap:12px;align-items:center;padding:8px 0;font-size:14px}
.bars i{display:block;height:10px;border-radius:5px;background:var(--ink)}
.bars i.soft{background:var(--lime)}
.bars span:last-child{text-align:right;font-weight:600;white-space:nowrap}
.qa{background:var(--gray);border-radius:16px;padding:18px 20px;margin-top:10px}
.qa .q{font-weight:600;display:flex;gap:10px}
.qa .q span{color:var(--ok);font-size:13px;white-space:nowrap;padding-top:2px}
.qa .a{color:var(--ink2);margin:8px 0 0}
.video{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media (max-width:700px){.video{grid-template-columns:1fr}}
.video a{position:relative;border-radius:14px;overflow:hidden;color:#fff;display:block;background:var(--navy);aspect-ratio:16/9;text-decoration:none}
.video img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.55)}
.video .play{position:absolute;inset:0;display:grid;place-items:center}
.video .play i{width:54px;height:54px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
.video .play i::after{content:"";border-left:16px solid var(--ink);border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.video span{position:absolute;left:14px;bottom:12px;font-size:13.5px;font-weight:600}
.check{list-style:none;padding:0;margin:10px 0 0}
.check li{padding:12px 0 12px 32px;border-bottom:1px solid var(--line);position:relative}
.check li::before{content:"";position:absolute;left:2px;top:16px;width:16px;height:16px;border:1.6px solid var(--ink);border-radius:5px}
.check small{display:block;color:var(--muted);font-size:13.5px}
.sign{margin-top:52px;padding-top:20px;border-top:1px solid var(--ink);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.sign b{color:var(--ink)}
.cta{margin-top:28px;background:var(--navy);color:#fff;border-radius:20px;padding:30px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.cta h3{margin:0 0 4px;font-size:21px}
.cta p{margin:0;opacity:.65}
.cta a{background:var(--lime);color:var(--ink);font-family:var(--head);font-weight:620;text-decoration:none;border-radius:12px;padding:14px 22px}
.state{max-width:520px;margin:80px auto;text-align:center;color:var(--muted)}
.state h1{color:var(--ink)}
.lightbox{position:fixed;inset:0;background:rgba(11,18,32,.92);display:grid;place-items:center;z-index:50;opacity:0;visibility:hidden;transition:opacity 220ms ease,visibility 0s linear 220ms;padding:20px}
.lightbox.on{opacity:1;visibility:visible;transition:opacity 220ms ease}
.lightbox img{max-height:86vh;border-radius:12px;transform:scale(.96);transition:transform 300ms var(--ease-out)}
.lightbox.on img{transform:none}
.lightbox p{color:#fff;text-align:center;margin:12px 0 0}
@media print{.bar,.notice,.toc,.cta{display:none}.layout{display:block;padding:0}.paper{padding:0}body{background:#fff;font-size:12px}h2{break-after:avoid}tr,figure,.qa,.keys li{break-inside:avoid}}
</style>
</head>

// 입찰 전에 알아야 할 숫자: 현장 확인·탐문으로 얻은 값과 그걸로 계산한 참고치 (입찰가 추천은 하지 않는다)
const W = n => { n = Math.round(+n || 0); if (!n) return ''; const e = Math.floor(n / 1e8), m = Math.round((n % 1e8) / 1e4); return (e ? e + '억' : '') + (m ? (e ? ' ' : '') + m.toLocaleString() + '만' : '') + '원'; };
function numbersCard(R) {
  const N = R.numbers || {}; const n = k => +String(N[k] || '').replace(/[^\d]/g, '') || 0;
  const common = n('feeCommon'), rl = n('repairLow'), rh = n('repairHigh'), mv = n('moveCost'), ml = n('marketLow'), mh = n('marketHigh'), js = n('jeonse'), mf = n('monthlyFee');
  if (!R.evict && !common && !rl && !ml && !mv) return '';
  const extraLow = common + rl + mv, extraHigh = common + (rh || rl) + mv;
  const disc = ml && R.min ? Math.round((1 - R.min / ml) * 100) : null;
  const jr = ml && js ? Math.round(js / ml * 100) : null;
  const EV = { 쉬움: ['var(--ok-bg)', 'var(--ok)'], 보통: ['#eef1f6', 'var(--ink2)'], 어려움: ['var(--warn-bg)', 'var(--warn)'] }[R.evict] || ['var(--gray)', 'var(--muted)'];
  const cell = (label, value, sub) => value ? `<div class="nc"><span>${label}</span><b>${value}</b>${sub ? `<small>${sub}</small>` : ''}</div>` : '';
  return `<div class="nums">
    <div class="nums-head"><b>입찰 전에 알아야 할 숫자</b><span>현장 확인과 탐문으로 얻은 참고치입니다</span></div>
    <div class="nums-top">
      ${R.evict ? `<div class="ev" style="background:${EV[0]};color:${EV[1]}"><span>명도 난이도</span><b>${esc(R.evict)}</b>${R.evictWhy ? `<small>${esc(R.evictWhy)}</small>` : ''}</div>` : ''}
      ${extraLow ? `<div class="ex"><span>낙찰 후 더 드는 돈 (대략)</span><b>${W(extraLow)}${extraHigh > extraLow ? ' ~ ' + W(extraHigh) : ''}</b><small>인수 관리비 + 수리비 + 이사비</small></div>` : ''}
    </div>
    <div class="nums-grid">
      ${cell('인수 예상 관리비', W(common), '공용부분 · 연체료 제외')}
      ${cell('수리비', rl ? W(rl) + (rh ? ' ~ ' + W(rh) : '') : '', esc(R.repairLevel || ''))}
      ${cell('이사비 관행', W(mv), '이 동네 명도 때 보통')}
      ${cell('시세', ml ? W(ml) + (mh ? ' ~ ' + W(mh) : '') : '', '급매가 ~ 호가')}
      ${cell('최저가가 시세보다', disc !== null ? (disc >= 0 ? disc + '% 싸요' : Math.abs(disc) + '% 비싸요') : '', '시세 하단 기준')}
      ${cell('전세가율', jr !== null ? jr + '%' : '', js ? '전세 ' + W(js) : '')}
      ${cell('월 관리비', W(mf), '낙찰 후 보유 비용')}
    </div></div>`;
}

      <p class="lead">사진을 누르면 크게 볼 수 있습니다.</p>
      <div class="gallery">${ph.map((p, i) => `<figure><img src="${esc(p.url)}" alt="" loading="lazy" data-i="${i}"><figcaption><b>사진 ${String(i + 1).padStart(2, '0')}${p.time ? ' · ' + esc(p.time) : ''}</b>${esc(p.cap)}</figcaption></figure>`).join('')}</div>
      ${(R.videos || []).length ? `<h3>영상</h3><div class="video">${R.videos.map(v => `<a href="${v.url ? esc(v.url) : '#'}" target="_blank" rel="noopener">${v.thumb ? `<img src="${esc(v.thumb)}" alt="">` : ''}<div class="play"><i></i></div><span>${esc(v.cap)}</span></a>`).join('')}</div>` : ''}` : ''}

    ${(R.missing || []).length ? `<h2 id="missing"><span>${String(++sec).padStart(2, '0')}</span>확인하지 못한 것</h2>
      <p class="lead">현장 확인으로는 알 수 없거나, 발품옥션이 다루지 않는 항목입니다.</p>
      <div class="tw"><table><thead><tr><th>항목</th><th>이유</th><th>확인 방법</th></tr></thead><tbody>${R.missing.map(m => `<tr><td>${esc(m.k)}</td><td>${esc(m.why)}</td><td>${esc(m.how)}</td></tr>`).join('')}</tbody></table></div>` : ''}

    <h2 id="check"><span>부록</span>입찰 전 체크리스트</h2>
    <ul class="check">
      <li>매각물건명세서 확인<small>매각기일 1주 전부터 법원경매정보에서 볼 수 있습니다. 임차인과 인수되는 권리를 확인합니다.</small></li>
      <li>전입세대확인서 발급<small>경매 정보 출력물과 신분증을 가지고 주민센터에서 발급받을 수 있습니다.</small></li>
      <li>등기사항증명서 최신본 확인<small>입찰 전날 다시 떼어 변동이 없는지 봅니다.</small></li>
      <li>체납 관리비 최종 금액 확인<small>입찰 직전 관리사무소에 전화로 확인합니다.</small></li>
      <li>대출 가능 금액 확인<small>경락잔금대출은 은행마다 한도가 다릅니다.</small></li>
      <li>입찰보증금 준비<small>최저매각가격의 10%${R.min ? ', 이 물건은 ' + eok(R.min * 0.1) : ''}입니다.</small></li>
    </ul>

    <div class="sign"><div>확인자 <b>${esc(R.partner || '발품 파트너')}</b><br>검수 <b>발품옥션 운영팀</b></div>
      <div style="text-align:right">확인일 현재 현장에서 본 사실을 기록한 참고 자료입니다.<br>이후 상태가 달라질 수 있고, 투자 결과를 보장하지 않습니다.</div></div>
    ${R.sample ? `<div class="cta"><div><h3>이런 리포트를 입찰 전에 받아보세요</h3><p>함께 신청하면 열람 수익을 나눠 돌려받습니다.</p></div><a href="./#list">신청 받는 물건 보기</a></div>` : ''}
  </article></div>`;

  // 사진 크게 보기
  document.querySelectorAll('img[data-i]').forEach(im => im.onclick = () => {
    const p = ph[+im.dataset.i]; if (!p) return;
    $('lb-img').src = p.url.replace('&sz=w1600', '&sz=w2400'); $('lb-cap').textContent = `사진 ${String(+im.dataset.i + 1).padStart(2, '0')} · ${p.cap}`;
    $('lb').classList.add('on');
  });
  document.title = `${R.title} | 현장 확인 리포트`;
}
$('lb').onclick = () => $('lb').classList.remove('on');
addEventListener('keydown', e => { if (e.key === 'Escape') $('lb').classList.remove('on'); });

function notice(html) { $('notice').innerHTML = html; $('notice').hidden = false; }
function fail(t, d) { $('root').innerHTML = `<div class="state"><h1>${t}</h1><p>${d}</p><p><a href="./">발품옥션으로 돌아가기</a></p></div>`; }

(async () => {
  const q = new URLSearchParams(location.search);
  if (q.has('preview')) {  // 파트너 작성 화면의 미리보기
    try { const R = JSON.parse(localStorage.getItem('balpum_preview') || 'null'); if (!R) throw 0; notice('<b>미리보기</b> · 아직 발행되지 않은 리포트입니다'); render(R); }
    catch (_) { fail('미리볼 내용이 없습니다', '현장 리포트 작성 화면에서 미리보기를 눌러 주세요.'); }
    return;
  }
  if (!q.get('id')) { notice('샘플 리포트입니다. 실제 물건이 아닌 가상의 사례이며, 사진은 <b>예시 이미지</b>입니다.'); render(SAMPLE); return; }
  try {
    const key = localStorage.getItem('balpum_partner_key') || '';
    const j = await (await fetch(`${ENDPOINT}?action=report&id=${encodeURIComponent(q.get('id'))}${key ? '&key=' + encodeURIComponent(key) : ''}`)).json();
    if (!j.ok) return fail(j.error === 'draft' ? '아직 발행되지 않은 리포트입니다' : '리포트를 찾을 수 없습니다', '링크를 다시 확인해 주세요.');
    if (j.status !== '공개') notice('<b>작성 중</b> · 파트너에게만 보이는 초안입니다');
    render(j.report);
  } catch (_) { fail('리포트를 불러오지 못했습니다', '잠시 뒤 새로고침해 주세요.'); }
})();
</script>
</body>
</html>
